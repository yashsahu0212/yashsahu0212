<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="220" viewBox="0 0 1000 220" role="img" aria-label="Engineering Activity and System Metrics">
<title>Engineering Activity and System Metrics</title>
<rect width="1000" height="220" rx="8" fill="#12303A" stroke="#2A4A52" stroke-width="2"/>

<!-- Column 1: Development Velocity -->
<g transform="translate(36, 32)">
  <text x="0" y="16" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#FF8A4C" letter-spacing="1.5">VELOCITY &amp; FOOTPRINT</text>
  <text x="0" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="36" font-weight="bold" fill="#EAF2EF">3.37M+</text>
  <text x="0" y="82" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#C7D8D3">Total Bytes Documented</text>
  
  <text x="0" y="126" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#8FA9A4">Active Systems: <tspan fill="#EAF2EF" font-weight="bold">12 Repositories</tspan></text>
  <text x="0" y="150" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#8FA9A4">Workflow Cadence: <tspan fill="#FF8A4C" font-weight="bold">Continuous Delivery</tspan></text>
</g>

<!-- Divider 1 -->
<line x1="330" y1="28" x2="330" y2="192" stroke="#2A4A52" stroke-width="1.5"/>

<!-- Column 2: Architectural Distribution -->
<g transform="translate(366, 32)">
  <text x="0" y="16" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#FF8A4C" letter-spacing="1.5">STACK COMPOSITION</text>
  
  <!-- Bar 1: HTML & CSS -->
  <text x="0" y="50" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#C7D8D3">Interface Markup (HTML/CSS)</text>
  <text x="260" y="50" text-anchor="end" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#EAF2EF">42.6%</text>
  <rect x="0" y="58" width="260" height="6" rx="3" fill="#1C3F4B"/>
  <rect x="0" y="58" width="111" height="6" rx="3" fill="#E34C26"/>
  
  <!-- Bar 2: JavaScript & TypeScript -->
  <text x="0" y="88" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#C7D8D3">Application Logic (JS/TS)</text>
  <text x="260" y="88" text-anchor="end" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#EAF2EF">40.0%</text>
  <rect x="0" y="96" width="260" height="6" rx="3" fill="#1C3F4B"/>
  <rect x="0" y="96" width="104" height="6" rx="3" fill="#F1E05A"/>
  
  <!-- Bar 3: Kotlin Mobile & Systems -->
  <text x="0" y="126" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#C7D8D3">Mobile &amp; Data (Kotlin/SQL/Py)</text>
  <text x="260" y="126" text-anchor="end" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#EAF2EF">17.4%</text>
  <rect x="0" y="134" width="260" height="6" rx="3" fill="#1C3F4B"/>
  <rect x="0" y="134" width="45" height="6" rx="3" fill="#A97BFF"/>
</g>

<!-- Divider 2 -->
<line x1="660" y1="28" x2="660" y2="192" stroke="#2A4A52" stroke-width="1.5"/>

<!-- Column 3: Telemetry Engine -->
<g transform="translate(696, 32)">
  <text x="0" y="16" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#FF8A4C" letter-spacing="1.5">SYSTEM TELEMETRY</text>
  
  <rect x="0" y="38" width="268" height="34" rx="4" fill="#0E242C" stroke="#2A4A52"/>
  <circle cx="16" cy="55" r="5" fill="#39D353"/>
  <text x="30" y="59" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#EAF2EF">GitHub Actions Cron: <tspan font-weight="bold">Active</tspan></text>
  
  <text x="0" y="104" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#8FA9A4">Nightly Koi Routine: <tspan fill="#EAF2EF" font-weight="bold">00:20 UTC</tspan></text>
  <text x="0" y="128" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#8FA9A4">Telemetry Pipeline: <tspan fill="#EAF2EF" font-weight="bold">git-koi v1</tspan></text>
  <text x="0" y="152" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#8FA9A4">Snapshot Integrity: <tspan fill="#FF8A4C" font-weight="bold">100% Verified</tspan></text>
</g>
</svg>