<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-label="Engineering Activity and Telemetry Stream">
<title>Engineering Activity and Telemetry Stream</title>
<defs>
  <linearGradient id="waveGradDark" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#FF8A4C" stop-opacity="0.35"/>
    <stop offset="100%" stop-color="#12303A" stop-opacity="0.0"/>
  </linearGradient>
  <pattern id="gridDark" width="20" height="20" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1" fill="#1C3F4B"/>
  </pattern>
</defs>

<!-- Outer Container -->
<rect width="1000" height="280" rx="10" fill="#0E1E24" stroke="#2A4A52" stroke-width="1.5"/>
<rect width="1000" height="280" rx="10" fill="url(#gridDark)" opacity="0.6"/>

<!-- Header Bar -->
<rect x="0" y="0" width="1000" height="42" rx="10" fill="#12303A"/>
<rect x="0" y="32" width="1000" height="10" fill="#12303A"/>
<line x1="0" y1="42" x2="1000" y2="42" stroke="#2A4A52" stroke-width="1"/>

<circle cx="24" cy="21" r="4" fill="#39D353"/>
<text x="36" y="25" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#EAF2EF" letter-spacing="1.5">TELEMETRY MONITOR // RUNTIME: NOMINAL</text>
<text x="976" y="25" text-anchor="end" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" fill="#8FA9A4" letter-spacing="1">CRON CADENCE: DAILY 00:20 UTC</text>

<!-- Left Panel: Waveform & Velocity Frequency -->
<g transform="translate(32, 64)">
  <text x="0" y="14" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#FF8A4C" letter-spacing="1.2">ACTIVITY PULSE // WEEKLY CADENCE</text>
  
  <!-- Waveform Area -->
  <path d="M 0 110 Q 50 40 100 80 T 200 60 T 300 100 T 400 30 T 480 70 L 480 140 L 0 140 Z" fill="url(#waveGradDark)"/>
  <path d="M 0 110 Q 50 40 100 80 T 200 60 T 300 100 T 400 30 T 480 70" fill="none" stroke="#FF8A4C" stroke-width="2.5"/>
  
  <!-- Waveform Nodes -->
  <circle cx="100" cy="80" r="4" fill="#EAF2EF" stroke="#FF8A4C" stroke-width="2"/>
  <circle cx="200" cy="60" r="4" fill="#EAF2EF" stroke="#FF8A4C" stroke-width="2"/>
  <circle cx="300" cy="100" r="4" fill="#EAF2EF" stroke="#FF8A4C" stroke-width="2"/>
  <circle cx="400" cy="30" r="5" fill="#FF8A4C" stroke="#EAF2EF" stroke-width="2"/>
  <circle cx="480" cy="70" r="4" fill="#EAF2EF" stroke="#FF8A4C" stroke-width="2"/>
  
  <!-- Day Markers -->
  <text x="10" y="162" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" fill="#8FA9A4">MON</text>
  <text x="90" y="162" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" fill="#8FA9A4">TUE</text>
  <text x="170" y="162" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" fill="#8FA9A4">WED</text>
  <text x="250" y="162" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" fill="#8FA9A4">THU</text>
  <text x="330" y="162" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" fill="#8FA9A4">FRI</text>
  <text x="410" y="162" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#FF8A4C">SAT (PEAK)</text>
  <text x="460" y="162" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" fill="#8FA9A4">SUN</text>
  
  <!-- Bottom Velocity Stats -->
  <text x="0" y="196" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="bold" fill="#EAF2EF">3.37M+ <tspan font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#C7D8D3">Bytes Engineered Across 12 Repositories</tspan></text>
</g>

<!-- Vertical Center Divider -->
<line x1="560" y1="58" x2="560" y2="262" stroke="#2A4A52" stroke-width="1.5"/>

<!-- Right Panel: Architectural Telemetry Stream -->
<g transform="translate(590, 64)">
  <text x="0" y="14" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#FF8A4C" letter-spacing="1.2">SYSTEM CADENCE &amp; TELEMETRY</text>
  
  <!-- Item 1: Concurrency Engine -->
  <g transform="translate(0, 36)">
    <rect x="0" y="0" width="378" height="42" rx="4" fill="#12303A" stroke="#24454E"/>
    <text x="14" y="18" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#EAF2EF">IPL Live Auction Engine</text>
    <text x="14" y="32" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" fill="#8FA9A4">Real-time multiplayer socket room arbitration &amp; concurrency</text>
    <text x="364" y="25" text-anchor="end" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#FF8A4C">VERIFIED</text>
  </g>
  
  <!-- Item 2: Mobile Sensor Telemetry -->
  <g transform="translate(0, 86)">
    <rect x="0" y="0" width="378" height="42" rx="4" fill="#12303A" stroke="#24454E"/>
    <text x="14" y="18" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#EAF2EF">Yatra Telemetry &amp; Mobility</text>
    <text x="14" y="32" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" fill="#8FA9A4">High-frequency sensor fusion &amp; spatio-temporal trip inference</text>
    <text x="364" y="25" text-anchor="end" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#A97BFF">ACTIVE</text>
  </g>
  
  <!-- Item 3: Automated Growth Engine -->
  <g transform="translate(0, 136)">
    <rect x="0" y="0" width="378" height="42" rx="4" fill="#12303A" stroke="#24454E"/>
    <text x="14" y="18" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#EAF2EF">Git-Koi Generative Growth</text>
    <text x="14" y="32" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" fill="#8FA9A4">Autonomous nightly pipeline re-synthesizing contribution pond</text>
    <text x="364" y="25" text-anchor="end" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#39D353">00:20 UTC</text>
  </g>
</g>
</svg>