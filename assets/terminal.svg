<svg width="850" height="360" viewBox="0 0 850 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Terminal session - About Yash Sahu">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#0a0d13" />
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#21262d" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#30363d" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.3" />
    </linearGradient>
  </defs>

  <style>
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .cursor {
      animation: blink 1.05s infinite;
    }
    .t-code {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", "Fira Code", Menlo, Consolas, monospace;
      font-size: 13px;
      line-height: 20px;
    }
    .prompt { fill: #38bdf8; font-weight: bold; }
    .cmd { fill: #f0f6fc; }
    .key { fill: #58a6ff; }
    .str { fill: #7ee787; }
    .arr { fill: #ffa657; }
    .punc { fill: #8b949e; }
    .comment { fill: #6e7681; font-style: italic; }
  </style>

  <!-- Window Container with Glow Border -->
  <rect x="1" y="1" width="848" height="358" rx="10" fill="url(#termBg)" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Terminal Header Bar -->
  <rect x="1" y="1" width="848" height="36" rx="10" fill="url(#headerGrad)" />
  <rect x="1" y="26" width="848" height="11" fill="url(#headerGrad)" />
  <line x1="1" y1="36" x2="849" y2="36" stroke="#30363d" stroke-width="1" />

  <!-- Window Controls -->
  <circle cx="22" cy="18" r="6" fill="#ff5f56" stroke="#e0443e" stroke-width="0.5" />
  <circle cx="42" cy="18" r="6" fill="#ffbd2e" stroke="#dea123" stroke-width="0.5" />
  <circle cx="62" cy="18" r="6" fill="#27c93f" stroke="#1aab29" stroke-width="0.5" />

  <!-- Window Title -->
  <text x="425" y="23" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#8b949e" font-weight="500">
    yash@workstation: ~ (zsh)
  </text>

  <!-- Terminal Content -->
  <g class="t-code" transform="translate(28, 62)">
    <!-- Command Execution -->
    <text x="0" y="0">
      <tspan class="prompt">➜  ~</tspan>
      <tspan fill="#8b949e"> </tspan>
      <tspan class="cmd">cat</tspan>
      <tspan fill="#8b949e"> developer.json</tspan>
    </text>

    <!-- JSON Output -->
    <text x="0" y="24">
      <tspan class="punc">{</tspan>
    </text>
    <text x="16" y="46">
      <tspan class="key">"name"</tspan><tspan class="punc">: </tspan><tspan class="str">"Yash Sahu"</tspan><tspan class="punc">,</tspan>
    </text>
    <text x="16" y="68">
      <tspan class="key">"role"</tspan><tspan class="punc">: </tspan><tspan class="str">"Full-Stack &amp; Systems Developer"</tspan><tspan class="punc">,</tspan>
    </text>
    <text x="16" y="90">
      <tspan class="key">"education"</tspan><tspan class="punc">: </tspan><tspan class="str">"B.Tech in CSE @ VIT Bhopal University"</tspan><tspan class="punc">,</tspan>
    </text>
    <text x="16" y="112">
      <tspan class="key">"languages"</tspan><tspan class="punc">: [</tspan><tspan class="arr">"JavaScript"</tspan><tspan class="punc">, </tspan><tspan class="arr">"TypeScript"</tspan><tspan class="punc">, </tspan><tspan class="arr">"Python"</tspan><tspan class="punc">, </tspan><tspan class="arr">"Kotlin"</tspan><tspan class="punc">],</tspan>
    </text>
    <text x="16" y="134">
      <tspan class="key">"technologies"</tspan><tspan class="punc">: [</tspan><tspan class="arr">"React"</tspan><tspan class="punc">, </tspan><tspan class="arr">"Node.js"</tspan><tspan class="punc">, </tspan><tspan class="arr">"Express"</tspan><tspan class="punc">, </tspan><tspan class="arr">"PostgreSQL"</tspan><tspan class="punc">, </tspan><tspan class="arr">"Docker"</tspan><tspan class="punc">],</tspan>
    </text>
    <text x="16" y="156">
      <tspan class="key">"status"</tspan><tspan class="punc">: </tspan><tspan class="str">"Open to Software Engineering Internships &amp; Roles"</tspan><tspan class="punc">,</tspan>
    </text>
    <text x="16" y="178">
      <tspan class="key">"motto"</tspan><tspan class="punc">: </tspan><tspan class="str">"Engineering resilient, deterministic software that scales."</tspan>
    </text>
    <text x="0" y="200">
      <tspan class="punc">}</tspan>
    </text>

    <!-- Next Prompt with Blinking Cursor -->
    <text x="0" y="232">
      <tspan class="prompt">➜  ~</tspan>
      <tspan fill="#8b949e"> </tspan>
      <tspan class="comment"># Ready to build reliable systems</tspan>
    </text>
    <rect class="cursor" x="255" y="220" width="8" height="15" fill="#38bdf8" />
  </g>
</svg>
