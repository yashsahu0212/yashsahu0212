<svg width="920" height="240" viewBox="0 0 920 240" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Yash Sahu - Full-Stack and Systems Engineer">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e131b" />
      <stop offset="100%" stop-color="#0a0d13" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#30363d" />
      <stop offset="50%" stop-color="#21262d" />
      <stop offset="100%" stop-color="#30363d" />
    </linearGradient>
    <pattern id="gridPattern" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.02" />
    </pattern>
    <radialGradient id="greenGlow" cx="15%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#3fb950" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#3fb950" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="blueGlow" cx="82%" cy="40%" r="40%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Outer Card Frame -->
  <rect x="1" y="1" width="918" height="238" rx="12" fill="url(#cardBg)" stroke="url(#borderGrad)" stroke-width="1.5" />
  <rect x="1" y="1" width="918" height="238" rx="12" fill="url(#gridPattern)" />
  <rect x="1" y="1" width="918" height="238" rx="12" fill="url(#greenGlow)" />
  <rect x="1" y="1" width="918" height="238" rx="12" fill="url(#blueGlow)" />

  <!-- Left Content: Identity & Architecture -->
  <g transform="translate(42, 34)">
    <!-- Status Indicator -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="270" height="24" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <circle cx="12" cy="12" r="3.5" fill="#3fb950" />
      <circle cx="12" cy="12" r="6.5" fill="#3fb950" fill-opacity="0.25" />
      <text x="24" y="15.5" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#8b949e" letter-spacing="1">SYSTEM: ACTIVE // READY TO BUILD</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif" font-size="38" font-weight="800" fill="#f0f6fc" letter-spacing="-0.8">
      Yash Sahu
    </text>

    <!-- Role / Discipline -->
    <text x="2" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif" font-size="15" font-weight="500" fill="#58a6ff" letter-spacing="0.2">
      Full-Stack &amp; Systems Developer
    </text>

    <!-- Architecture & Statement -->
    <text x="2" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif" font-size="13" font-weight="400" fill="#8b949e">
      Engineering real-time bidding engines, mobile telemetry sensors,
    </text>
    <text x="2" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif" font-size="13" font-weight="400" fill="#8b949e">
      and scalable web applications with resilient architecture.
    </text>

    <!-- Stack Badges -->
    <g transform="translate(2, 170)">
      <!-- TypeScript -->
      <rect x="0" y="0" width="76" height="20" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <text x="38" y="13.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10.5" font-weight="600" fill="#c9d1d9">TypeScript</text>

      <!-- Kotlin -->
      <rect x="82" y="0" width="56" height="20" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <text x="110" y="13.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10.5" font-weight="600" fill="#c9d1d9">Kotlin</text>

      <!-- Python -->
      <rect x="144" y="0" width="58" height="20" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <text x="173" y="13.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10.5" font-weight="600" fill="#c9d1d9">Python</text>

      <!-- PostgreSQL -->
      <rect x="208" y="0" width="78" height="20" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <text x="247" y="13.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10.5" font-weight="600" fill="#c9d1d9">PostgreSQL</text>

      <!-- Docker -->
      <rect x="292" y="0" width="58" height="20" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <text x="321" y="13.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10.5" font-weight="600" fill="#c9d1d9">Docker</text>
    </g>
  </g>

  <!-- Right Content: Terminal Spec Window -->
  <g transform="translate(540, 24)">
    <rect x="0" y="0" width="344" height="192" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1" />
    
    <!-- Window Header Bar -->
    <rect x="0" y="0" width="344" height="28" rx="8" fill="#1c2128" />
    <path d="M 0 28 L 344 28" stroke="#30363d" stroke-width="1" />
    <circle cx="16" cy="14" r="4.5" fill="#f85149" fill-opacity="0.8" />
    <circle cx="30" cy="14" r="4.5" fill="#e3b341" fill-opacity="0.8" />
    <circle cx="44" cy="14" r="4.5" fill="#2ea043" fill-opacity="0.8" />
    <text x="172" y="18" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" fill="#7d8590">terminal ~ profile.sh</text>

    <!-- Terminal Code / Specs -->
    <g transform="translate(18, 50)" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5">
      <!-- Line 1 -->
      <text x="0" y="0" fill="#79c0ff">$</text>
      <text x="14" y="0" fill="#e6edf3">sysinfo</text>
      <text x="74" y="0" fill="#7d8590">--user yashsahu0212</text>

      <!-- Line 2 -->
      <text x="0" y="24" fill="#7d8590">NAME</text>
      <text x="80" y="24" fill="#f0f6fc">Yash Sahu</text>

      <!-- Line 3 -->
      <text x="0" y="46" fill="#7d8590">FOCUS</text>
      <text x="80" y="46" fill="#7ee787">Full-Stack &amp; Telemetry</text>

      <!-- Line 4 -->
      <text x="0" y="68" fill="#7d8590">EDUCATION</text>
      <text x="80" y="68" fill="#e6edf3">VIT Bhopal University</text>

      <!-- Line 5 -->
      <text x="0" y="90" fill="#7d8590">WORKFLOW</text>
      <text x="80" y="90" fill="#d2a8ff">Microservices · CI/CD · Git</text>

      <!-- Line 6 -->
      <text x="0" y="112" fill="#7d8590">MISSION</text>
      <text x="80" y="112" fill="#e6edf3">High-impact, reliable systems</text>

      <!-- Cursor -->
      <rect x="0" y="126" width="7" height="13" fill="#3fb950" fill-opacity="0.9" />
    </g>
  </g>
</svg>
